name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest requests pillow customtkinter

      - name: Shared contracts required on both platforms
        run: python -m pytest -q -m shared --junitxml=build/shared-results.xml

      - name: macOS platform contracts
        if: runner.os == 'macOS'
        run: python -m pytest -q -m macos --junitxml=build/macos-results.xml

      - name: Windows hosted-runner contracts
        if: runner.os == 'Windows'
        run: python -m pytest -q -m windows_ci --junitxml=build/windows-ci-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: build/*-results.xml
