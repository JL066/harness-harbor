name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt

      - name: Run isolated unit suite
        shell: pwsh
        env:
          HARBOR_AGY_DANGEROUSLY_SKIP_PERMISSIONS: ""
          HARBOR_TUNNEL_EXE: ""
          HARBOR_TUNNEL_PROFILE_DIR: ""
          HARBOR_TUNNEL_PROFILE: ""
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -like 'HARBOR_*' } | ForEach-Object {
            Remove-Item -LiteralPath ("Env:" + $_.Name) -ErrorAction SilentlyContinue
          }
          python -m unittest discover -s tests -v
