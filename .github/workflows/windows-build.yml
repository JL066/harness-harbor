name: Windows build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-windows-build.txt

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_platform_paths.py
          tests/test_shared_runtime_protocol.py
          tests/test_shared_lifecycle.py
          tests/test_tunnel_command.py
          tests/test_runtime_logging.py
          tests/test_shared_snapshot.py
          tests/test_windows_process.py
          tests/test_runtime_bootstrap.py
          tests/test_runtime_client.py
          tests/test_runtime_client_credentials.py
          tests/test_packaged_core.py
          tests/test_packaged_launcher.py
          tests/test_packaged_setup.py
          tests/test_windows_bundle.py
          tests/test_windows_distribution.py
          tests/unit_launcher/test_user_settings.py
          tests/unit_launcher/test_batch6_integration.py

      - name: Build Windows bundle
        run: python build_exe.py
